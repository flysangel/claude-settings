name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run tests
        run: uv run --with pytest pytest -v

  # Each platform initializes a new repository with sdd-init and uploads it as a git bundle.
  cross-platform-produce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Initialize a repository and bundle it
        env:
          SDD_CROSS_PLATFORM: produce
          SDD_CROSS_PLATFORM_OWN: ${{ runner.temp }}/sdd-init-own
        run: uv run --with pytest pytest -v -rs tests/e2e/test_cross_platform.py
      - uses: actions/upload-artifact@v4
        with:
          name: sdd-init-${{ matrix.os }}
          path: ${{ runner.temp }}/sdd-init-own
          if-no-files-found: error

  # Each platform clones the repository the other platform initialized and runs Spec Kit's scripts in it.
  cross-platform:
    needs: cross-platform-produce
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            other: windows-latest
          - os: windows-latest
            other: ubuntu-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: sdd-init-${{ matrix.other }}
          path: ${{ runner.temp }}/sdd-init-other
      - uses: actions/download-artifact@v4
        with:
          name: sdd-init-${{ matrix.os }}
          path: ${{ runner.temp }}/sdd-init-own
      - name: Use the repository initialized on ${{ matrix.other }}
        env:
          SDD_CROSS_PLATFORM: verify
          SDD_CROSS_PLATFORM_OTHER: ${{ runner.temp }}/sdd-init-other
          SDD_CROSS_PLATFORM_OWN: ${{ runner.temp }}/sdd-init-own
        run: uv run --with pytest pytest -v -rs tests/e2e/test_cross_platform.py
